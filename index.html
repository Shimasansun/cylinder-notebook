<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>排出記録ノート</title>
<style>
:root{--pink:#f4a6c8;--bg:#fff7fb;--ink:#44313d;--muted:#8a7181;--line:#efd9e5;--red:#e34b5e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}
header{padding:22px 16px 16px;background:linear-gradient(135deg,#ffd9eb,#f5c8e4);text-align:center}h1{font-size:1.25rem;margin:0 0 6px}header p{margin:0;font-size:.85rem}
main{max-width:760px;margin:auto;padding:14px}.tabs{display:flex;gap:8px;margin-bottom:12px}.tab{flex:1;padding:11px;border:1px solid var(--line);border-radius:12px;background:white;color:var(--ink);font-weight:700}.tab.active{background:#eec4df;border-color:#e4a8d0}
.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 3px 10px #b66c8b0d}label{display:block;font-size:.9rem;font-weight:700;margin:8px 0 5px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid #dfc6d5;border-radius:10px;background:white;color:var(--ink)}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
button{font:inherit;border:0;border-radius:11px;padding:10px 12px;background:#edb9d7;color:#4c2d43;font-weight:700;cursor:pointer}button.secondary{background:#f7edf4;border:1px solid var(--line)}button.danger{background:#ffe2e5;color:#a32c3a}button:disabled{opacity:.45}.tiny{width:38px;min-width:38px;padding:6px;font-size:1.1rem;line-height:1}.meta-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 38px;gap:8px;align-items:end}.meta-row>div{min-width:0}.bottom-actions{display:flex;gap:8px;align-items:center;margin-top:16px}.bottom-actions>*{flex:1}.bottom-actions button{font-size:.88rem;padding:8px 10px}
.cardrow{display:grid;grid-template-columns:30px minmax(0,1fr) 78px 90px 38px;gap:5px;align-items:center;margin:7px 0}.cardrow .picker{grid-column:2/-1;font-size:.8rem;padding:6px}.num{text-align:center;color:var(--muted);font-size:.85rem}.unknown{border:2px solid var(--red)!important;background:#fff4f5!important}
.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:3px 8px;font-size:.78rem;color:var(--muted)}.record{border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0}.record h3{font-size:1rem;margin:0 0 7px}.seq{display:flex;gap:6px;flex-wrap:wrap;margin:5px 0}.chip{padding:7px 9px;border:1px solid #e6cad9;border-radius:9px;background:#fffafd;font-size:.86rem}.chip.unk{border:2px solid var(--red);background:#fff4f5}
small,.muted{color:var(--muted)}.hidden{display:none!important}.subtabs{display:flex;gap:7px;margin-bottom:10px}.subtab{flex:1;background:#fff;border:1px solid var(--line)}.subtab.active{background:#f0d0e3}.search-columns{display:grid;grid-template-columns:1fr 1fr;gap:10px}.search-col{border:1px solid var(--line);border-radius:12px;padding:9px;background:#fff}.search-col h3{margin:0 0 7px;font-size:.95rem}.query-card{display:flex;align-items:center;gap:6px;margin:5px 0}.query-card span{flex:1;min-width:0;overflow-wrap:anywhere}.query-card button{padding:5px 8px}.search-col.left-col{border-color:#9ec8f2;background:#f5faff}.search-col.right-col{border-color:#f2a9c9;background:#fff6fa}.search-col.left-col h3{color:#2874b8}.search-col.right-col h3{color:#c14d85}.side-add.left{border:1px solid #78b5e9!important;background:#e5f3ff!important;color:#205f99!important}.side-add.right{border:1px solid #e88ab6!important;background:#ffe8f3!important;color:#a43c70!important}.query-card.left{border-left:3px solid #62a7e5;padding-left:5px}.query-card.right{border-left:3px solid #e77fb0;padding-left:5px}.catalog-filter.left-active{border-color:#62a7e5!important;box-shadow:0 0 0 2px #62a7e533}.catalog-filter.right-active{border-color:#e77fb0!important;box-shadow:0 0 0 2px #e77fb033}.catalog-filter:focus{outline:none}.catalog-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:9px}.catalog-card{border:1px solid var(--line);border-radius:10px;padding:7px;background:#fff;cursor:pointer;text-align:center}.catalog-card img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#fff7fb;border-radius:6px}.catalog-card .cname{font-size:.8rem;line-height:1.3;margin-top:4px;overflow-wrap:anywhere}.catalog-card .cnum{font-size:.72rem;color:var(--muted)}.match{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0}.match h3{font-size:.95rem;margin:0 0 6px}.match small{display:block}.match .seq{font-size:.83rem}.empty{padding:15px;text-align:center;color:var(--muted)}.modal-back{position:fixed;inset:0;background:#3b24364d;display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}.modal{background:white;border-radius:16px;padding:16px;width:min(500px,100%);max-height:90vh;overflow:auto}.modal h2{font-size:1.05rem;margin-top:0}.modal-actions{display:flex;gap:8px;margin-top:12px}.modal-actions>*{flex:1}.admin-log{font-size:.78rem;color:var(--muted);margin-top:16px;text-align:right}.admin-log button{padding:4px 7px;font-size:.75rem}
@media(max-width:420px){.cardrow{grid-template-columns:24px minmax(0,1fr) 62px 68px 32px;gap:4px}.cardrow input,.cardrow select{padding:8px;font-size:.88rem}.panel{padding:11px}.catalog-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.search-col{padding:7px}.meta-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px;gap:5px}.meta-row input{padding:8px;font-size:.88rem}.meta-row .tiny{width:34px;min-width:34px}}
</style>
</head>
<body>
<header><h1>排出記録ノート</h1><p>悪用厳禁！</p></header>
<main>
<div class="tabs"><button class="tab active" id="tabNew" onclick="show('new')">記録する</button><button class="tab" id="tabList" onclick="show('list')">ログ検索</button></div>
<section id="newPanel">
<div class="panel">
<label>弾</label><div class="row"><input id="series" list="seriesOptions" placeholder="弾名"><button class="tiny secondary" title="選択肢の追加・編集・削除" onclick="manageOptions('series')">＋</button></div><datalist id="seriesOptions"></datalist>
<label>記録日</label><input id="date" type="date">
<div class="meta-row"><div><label>場所・機体など</label><input id="place" placeholder="任意"></div><div><label>登録者</label><input id="author" list="authorOptions" placeholder="名前"></div><button class="tiny secondary" title="選択肢の追加・編集・削除" onclick="manageOptions('author')">＋</button></div><datalist id="authorOptions"></datalist>
<label>メモ</label><textarea id="memo" rows="2" placeholder="任意"></textarea>
</div>
<div class="panel"><div class="row" style="align-items:center"><h2 style="font-size:1.05rem;margin:0">購入順の記録</h2><span id="count" class="pill">0 / 21枚</span></div>
<p class="muted" style="font-size:.83rem">排出順にカード名（またはカード番号）とシリンダーを入力できます。画像からも追加できます。不明は赤枠で表示されます。</p><div id="rows"></div><div class="row"><button class="secondary" onclick="addRow()" id="addBtn">＋ カードを追加</button><button onclick="saveRecord()">保存する</button></div></div>
</section>
<section id="listPanel" class="hidden">
<div class="panel"><div class="subtabs"><button class="subtab active" id="subSearch" onclick="showListMode('search')">カード検索</button><button class="subtab" id="subRecords" onclick="showListMode('records')">記録一覧</button></div>
<div id="searchMode">
<p class="muted" style="font-size:.83rem;margin-top:0">左右それぞれの順番にカードを追加すると、保存記録を自動検索します。</p>
<div class="search-columns"><div class="search-col left-col"><h3>左シリンダー</h3><div id="leftQuery"></div><button class="secondary side-add left" style="width:100%" onclick="openCatalog('left')">＋ カード追加</button></div><div class="search-col right-col"><h3>右シリンダー</h3><div id="rightQuery"></div><button class="secondary side-add right" style="width:100%" onclick="openCatalog('right')">＋ カード追加</button></div></div>
<label>カードを検索</label><input id="catalogFilter" class="catalog-filter" placeholder="カード名・番号から検索" oninput="renderCatalog()"><h3 style="font-size:.9rem;margin:12px 0 4px">画像からカード検索</h3><div id="catalog" class="catalog-grid"></div><div id="matches"></div>
</div>
<div id="recordsMode" class="hidden"><label>シリーズで絞り込み</label><input id="filter" placeholder="シリーズ名" oninput="renderRecords()"><div id="records"></div></div>
</div></section>
<div class="bottom-actions"><button class="secondary" onclick="openCardModal()">カードを登録</button><button class="secondary" onclick="showFeatureLog()">機能追加ログ</button></div>
</main><div id="modalRoot"></div>
<script>
const KEY='cylinder-notebook-prototype-v1',CATKEY='cylinder-card-catalog-v1',OPTKEY='cylinder-options-v1',LOGKEY='cylinder-feature-log-v1';
let rows=[{name:'',source:'right'}],query={left:[],right:[]},catalogFocus='left';
function readJSON(k,fallback){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(fallback))}catch{return fallback}}
function show(which){document.getElementById('newPanel').classList.toggle('hidden',which!=='new');document.getElementById('listPanel').classList.toggle('hidden',which!=='list');document.getElementById('tabNew').classList.toggle('active',which==='new');document.getElementById('tabList').classList.toggle('active',which==='list');if(which==='list'){showListMode('search');renderCatalog();renderMatches()}}
function showListMode(mode){document.getElementById('searchMode').classList.toggle('hidden',mode!=='search');document.getElementById('recordsMode').classList.toggle('hidden',mode!=='records');document.getElementById('subSearch').classList.toggle('active',mode==='search');document.getElementById('subRecords').classList.toggle('active',mode==='records');if(mode==='records')renderRecords();else{renderCatalog();renderMatches()}}
function drawRows(){let root=document.getElementById('rows');root.innerHTML='';rows.forEach((r,i)=>{let d=document.createElement('div');d.className='cardrow';d.innerHTML=`<span class="num">${i+1}</span><input aria-label="カード名または番号 ${i+1}" placeholder="カード名 / 番号" value="${esc(r.name)}" oninput="rows[${i}].name=this.value"><select aria-label="排出元" onchange="rows[${i}].source=this.value"><option value="right" ${r.source==='right'?'selected':''}>右</option><option value="left" ${r.source==='left'?'selected':''}>左</option><option value="unknown" ${r.source==='unknown'?'selected':''}>不明</option></select><button class="danger" onclick="removeRow(${i})" title="削除">×</button><button class="secondary picker" onclick="openRecordCatalog(${i})">画像からカードを追加</button>`;if(r.source==='unknown')d.querySelector('input').classList.add('unknown');d.querySelector('select').classList.toggle('unknown',r.source==='unknown');root.appendChild(d)});document.getElementById('count').textContent=rows.length+' / 21枚';document.getElementById('addBtn').disabled=rows.length>=21}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function addRow(){if(rows.length<21){rows.push({name:'',source:'right'});drawRows()}}
function removeRow(i){rows.splice(i,1);if(!rows.length)rows=[{name:'',source:'right'}];drawRows()}
function getRecords(){return readJSON(KEY,[])}
function saveRecord(){let cards=rows.filter(r=>r.name.trim()).map(r=>{let v=r.name.trim(),catalog=getCatalog(),c=catalog.find(x=>x.number===v||x.name===v);return {name:c?c.name:v,number:c?c.number:'',source:r.source}});if(!cards.length){alert('カード名を1枚以上入力してね！');return}let rec={id:Date.now(),series:document.getElementById('series').value.trim()||'シリーズ未設定',date:document.getElementById('date').value,place:document.getElementById('place').value.trim(),author:document.getElementById('author').value.trim(),memo:document.getElementById('memo').value.trim(),cards};let all=getRecords();all.unshift(rec);localStorage.setItem(KEY,JSON.stringify(all));alert('保存できたよ！');rows=[{name:'',source:'right'}];drawRows();['series','date','place','author','memo'].forEach(id=>document.getElementById(id).value='');show('list');showListMode('records')}
function sequences(cards){return {right:cards.filter(c=>c.source==='right').map(c=>c.name),left:cards.filter(c=>c.source==='left').map(c=>c.name),unknown:cards.filter(c=>c.source==='unknown').map(c=>c.name)}}
function renderRecords(){let f=(document.getElementById('filter')?.value||'').trim().toLowerCase();let rs=getRecords().filter(r=>(r.series||'').toLowerCase().includes(f));let out=document.getElementById('records');if(!out)return;if(!rs.length){out.innerHTML='<div class="panel muted">まだ記録がないよ。最初の記録を登録してみて！</div>';return}out.innerHTML=rs.map(r=>{let s=sequences(r.cards||[]);return `<div class="record"><h3>${esc(r.series)} <span class="pill">${r.cards.length}枚</span></h3><small>${esc(r.date||'日付未設定')} ・ ${esc(r.place||'場所未設定')} ・ 登録者：${esc(r.author||'未設定')}</small><p style="margin:8px 0 3px"><b>右シリンダー</b></p><div class="seq">${s.right.map(n=>`<span class="chip">${esc(n)}</span>`).join('')||'<small>未記録</small>'}</div><p style="margin:8px 0 3px"><b>左シリンダー</b></p><div class="seq">${s.left.map(n=>`<span class="chip">${esc(n)}</span>`).join('')||'<small>未記録</small>'}</div>${s.unknown.length?`<p style="margin:8px 0 3px"><b style="color:#d43b50">排出元不明</b></p><div class="seq">${s.unknown.map(n=>`<span class="chip unk">${esc(n)} ・ 不明</span>`).join('')}</div>`:''}${r.memo?`<p><small>メモ：${esc(r.memo)}</small></p>`:''}<button class="danger" onclick="deleteRecord(${r.id})">この記録を削除</button></div>`}).join('')}
function deleteRecord(id){if(confirm('この記録を削除する？')){localStorage.setItem(KEY,JSON.stringify(getRecords().filter(r=>r.id!==id)));renderRecords();renderMatches()}}
// ＋から選択肢の追加・編集・削除を選択。削除しても保存済み記録は残す。
function getOptions(){return readJSON(OPTKEY,{series:[],author:[]})}
function manageOptions(kind){let label=kind==='series'?'弾':'登録者',o=getOptions(),arr=o[kind];let action=prompt(`${label}の選択肢管理\n\n1：追加\n2：編集\n3：削除\n\n操作番号を入力してください`);if(!action)return;
 if(action==='1'){let val=prompt(`追加する${label}名`,document.getElementById(kind).value.trim());if(val&&val.trim()){val=val.trim();if(arr.includes(val))alert('同じ選択肢がすでに登録されています');else arr.push(val)}}
 else if(action==='2'){if(!arr.length){alert('編集できる選択肢がありません');return}let old=prompt(`変更する項目名\n\n${arr.join('\n')}`);if(old&&arr.includes(old)){let val=prompt('新しい名前',old);if(val&&val.trim()){val=val.trim();if(arr.includes(val)&&val!==old)alert('同じ選択肢がすでにあります');else arr[arr.indexOf(old)]=val}}else if(old)alert('登録項目と一致しません')}
 else if(action==='3'){if(!arr.length){alert('削除できる選択肢がありません');return}let old=prompt(`削除する項目名\n\n${arr.join('\n')}`);if(old&&arr.includes(old)&&confirm(`「${old}」を選択肢から削除しますか？\n※過去の記録はそのまま残ります。`))arr.splice(arr.indexOf(old),1);else if(old&&!arr.includes(old))alert('登録項目と一致しません')}
 else{alert('1、2、3のいずれかを入力してください');return}localStorage.setItem(OPTKEY,JSON.stringify(o));renderOptions()}
function renderOptions(){let o=getOptions();['series','author'].forEach(k=>{let d=document.getElementById(k+'Options');if(d)d.innerHTML=o[k].map(v=>`<option value="${esc(v)}"></option>`).join('')})}
// Catalog cards: image/name/number/series are stored together. Image upload is local prototype only.
function getCatalog(){return readJSON(CATKEY,[])}
function openCatalog(side){catalogFocus=side;renderCatalog();document.getElementById('catalogFilter').focus()}
function catalogMarkup(cards,action){return cards.map(c=>`<button class="catalog-card" onclick="${action}('${c.id}')">${c.image?`<img src="${c.image}" alt="">`:`<div style="aspect-ratio:3/4;background:#fff7fb;display:grid;place-items:center;color:#a78b9d">画像なし</div>`}<div class="cname">${esc(c.name)}</div><div class="cnum">${esc(c.number)}</div></button>`).join('')}
function renderCatalog(){let box=document.getElementById('catalog');if(!box)return;let input=document.getElementById('catalogFilter');let q=(input?.value||'').trim().toLowerCase();if(input){input.classList.remove('left-active','right-active');input.classList.add(catalogFocus==='left'?'left-active':'right-active')}let cards=getCatalog();if(!cards.length){box.innerHTML='<div class="empty" style="grid-column:1/-1">カードカタログはまだ空だよ。<br>「カードを登録」から画像・名前・番号を登録できます。</div>';return}let shown=cards.filter(c=>(c.name+' '+c.number+' '+c.series).toLowerCase().includes(q));let grouped={};shown.forEach(c=>(grouped[c.series||'弾未設定']??=[]).push(c));box.innerHTML=Object.entries(grouped).map(([series,items],i)=>`<details ${q?'open':''} style="grid-column:1/-1;border:1px solid var(--line);border-radius:10px;padding:7px"><summary style="font-weight:700;cursor:pointer">${esc(series)} <small>(${items.length}枚)</small></summary><div class="catalog-grid">${catalogMarkup(items,`addQueryCard`)}</div></details>`).join('')||'<div class="empty" style="grid-column:1/-1">該当するカードがありません</div>'}
function openRecordCatalog(index){let q='';let cards=getCatalog();let seriesList=[...new Set(cards.map(c=>c.series||'弾未設定'))];document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>画像からカードを追加</h2><p class="muted">カードを選ぶと購入順の入力欄に反映されます。</p><label>カード名・番号で検索</label><input id="recordCatalogFilter" placeholder="検索" oninput="renderRecordCatalog(${index})"><div id="recordCatalogList"></div><div class="modal-actions"><button class="secondary" onclick="closeModal()">閉じる</button></div></div></div>`;renderRecordCatalog(index)}
function renderRecordCatalog(index){let q=(document.getElementById('recordCatalogFilter')?.value||'').trim().toLowerCase();let cards=getCatalog().filter(c=>(c.name+' '+c.number+' '+c.series).toLowerCase().includes(q));let root=document.getElementById('recordCatalogList');if(!root)return;let grouped={};cards.forEach(c=>(grouped[c.series||'弾未設定']??=[]).push(c));root.innerHTML=Object.entries(grouped).map(([series,items])=>`<details open style="border:1px solid var(--line);border-radius:10px;padding:7px;margin:7px 0"><summary style="font-weight:700;cursor:pointer">${esc(series)} (${items.length}枚)</summary><div class="catalog-grid">${items.map(c=>`<button class="catalog-card" onclick="selectRecordCard(${index},'${c.id}')">${c.image?`<img src="${c.image}" alt="">`:`<div style="aspect-ratio:3/4;display:grid;place-items:center">画像なし</div>`}<div class="cname">${esc(c.name)}</div><div class="cnum">${esc(c.number)}</div></button>`).join('')}</div></details>`).join('')||'<p class="empty">カードがありません</p>'}
function selectRecordCard(index,id){let c=getCatalog().find(x=>x.id===id);if(!c)return;rows[index].name=c.name;drawRows();closeModal();}

function addQueryCard(id){let c=getCatalog().find(c=>c.id===id);if(!c)return;query[catalogFocus].push(c.name);renderQuery();renderMatches()}
function renderQuery(){['left','right'].forEach(side=>{let box=document.getElementById(side+'Query');box.innerHTML=query[side].map((n,i)=>`<div class="query-card ${side}"><small>${i+1}</small><span>${esc(n)}</span><button class="danger" onclick="removeQuery('${side}',${i})">×</button></div>`).join('')||'<small class="muted">未入力</small>'})}
function removeQuery(side,i){query[side].splice(i,1);renderQuery();renderMatches()}
function isSubseq(queryArr,recordArr){if(!queryArr.length)return true;let qpos=0;for(let n of recordArr){if(n===queryArr[qpos])qpos++;if(qpos===queryArr.length)return true}return false}
function hasContiguous(queryArr,recordArr){if(!queryArr.length)return true;if(queryArr.length>recordArr.length)return false;for(let i=0;i<=recordArr.length-queryArr.length;i++)if(queryArr.every((n,j)=>n===recordArr[i+j]))return true;return false}
function renderMatches(){let out=document.getElementById('matches');if(!out)return;let l=query.left,r=query.right;if(!l.length&&!r.length){out.innerHTML='<div class="empty">カードを選ぶと一致する記録が表示されます</div>';return}let found=[];getRecords().forEach(rec=>{let s=sequences(rec.cards||[]);let rl=s.right.concat(s.unknown),ll=s.left.concat(s.unknown);let normal=( (!l.length||hasContiguous(l,ll))&&(!r.length||hasContiguous(r,rl)) );let swapped=((!l.length||hasContiguous(l,rl))&&(!r.length||hasContiguous(r,ll)));if(normal||swapped){found.push({rec,swapped})}});out.innerHTML='<h3 style="font-size:1rem;margin:14px 0 6px">検索結果：'+found.length+'件</h3>'+ (found.length?found.map(({rec,swapped})=>`<div class="match"><h3>${esc(rec.series)} <span class="pill">${rec.cards.length}枚</span></h3><small>${esc(rec.date||'日付未設定')} ・ ${esc(rec.place||'場所未設定')} ・ ${esc(rec.author||'未設定')}${swapped?' ・ 左右反転で一致':''}</small><p style="margin:6px 0 2px"><b>右</b></p><div class="seq">${sequences(rec.cards).right.map(n=>`<span class="chip">${esc(n)}</span>`).join('')||'<small>なし</small>'}</div><p style="margin:6px 0 2px"><b>左</b></p><div class="seq">${sequences(rec.cards).left.map(n=>`<span class="chip">${esc(n)}</span>`).join('')||'<small>なし</small>'}</div><button class="secondary" onclick="showListMode('records');document.getElementById('filter').value='${esc(rec.series)}';renderRecords()">記録一覧で見る</button></div>`).join(''):'<div class="empty">一致する記録はまだありません</div>')}
function openCardModal(){document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>カードを登録</h2><label>弾</label><select id="newCardSeries"><option value="">弾を選択</option></select><label>カード番号</label><input id="newCardNumber" placeholder="例：001"><label>カード名</label><input id="newCardName" placeholder="カード名"><label>画像（端末から選ぶ）</label><input id="newCardImage" type="file" accept="image/*"><small>試作版では画像もこのブラウザ内に保存されます。画像サイズが大きい場合は保存容量に注意してね。</small><div class="modal-actions"><button class="secondary" onclick="closeModal()">キャンセル</button><button onclick="saveCatalogCard()">保存</button></div><button class="secondary" style="width:100%;margin-top:10px" onclick="openCatalogEditor()">登録済みカードを編集</button></div></div>`;let opts=getOptions().series;document.getElementById('newCardSeries').innerHTML='<option value="">弾を選択</option>'+opts.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function saveCatalogCard(){let name=document.getElementById('newCardName').value.trim(),number=document.getElementById('newCardNumber').value.trim(),series=document.getElementById('newCardSeries').value.trim();if(!name||!number||!series){alert('弾・カード番号・カード名を入力してね');return}let file=document.getElementById('newCardImage').files[0];let save=image=>{let c=getCatalog();c.push({id:String(Date.now()),series,number,name,image:image||''});localStorage.setItem(CATKEY,JSON.stringify(c));closeModal();renderCatalog()};if(file){let reader=new FileReader();reader.onload=()=>save(reader.result);reader.readAsDataURL(file)}else save('')}
function openCatalogEditor(){document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>登録済みカードの編集</h2><p class="muted">編集したいカードを選んでね。カード名・番号・弾・画像を変更できます。</p><label>カード名・番号で検索</label><input id="catalogEditFilter" placeholder="検索" oninput="renderCatalogEditor()"><div id="catalogEditList"></div><div class="modal-actions"><button class="secondary" onclick="openCardModal()">戻る</button><button class="secondary" onclick="closeModal()">閉じる</button></div></div></div>`;renderCatalogEditor()}
function renderCatalogEditor(){let q=(document.getElementById('catalogEditFilter')?.value||'').trim().toLowerCase(),root=document.getElementById('catalogEditList');if(!root)return;let cards=getCatalog().filter(c=>(c.name+' '+c.number+' '+c.series).toLowerCase().includes(q));root.innerHTML=cards.map(c=>`<button class="catalog-card" style="display:flex;width:100%;align-items:center;gap:10px;text-align:left;margin:6px 0" onclick="editCatalogCard('${c.id}')">${c.image?`<img src="${c.image}" alt="" style="width:64px;flex:none">`:`<div style="width:64px;aspect-ratio:3/4;background:#fff7fb;display:grid;place-items:center;flex:none">画像なし</div>`}<span><b>${esc(c.name)}</b><br><small>${esc(c.series)} / ${esc(c.number)}</small><br><small>タップして編集</small></span></button>`).join('')||'<p class="empty">該当するカードがありません</p>'}
function editCatalogCard(id){let c=getCatalog().find(x=>x.id===id);if(!c)return;let opts=getOptions().series;document.getElementById('modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>カード情報を編集</h2><label>弾</label><select id="editCardSeries"><option value="">弾を選択</option>${opts.map(v=>`<option value="${esc(v)}" ${v===c.series?'selected':''}>${esc(v)}</option>`).join('')}</select><label>カード番号</label><input id="editCardNumber" value="${esc(c.number)}"><label>カード名</label><input id="editCardName" value="${esc(c.name)}"><label>現在の画像</label>${c.image?`<img src="${c.image}" style="width:100%;max-height:220px;object-fit:contain;background:#fff7fb;border-radius:8px">`:`<p class="muted">画像未登録</p>`}<label>画像を変更（選択しなければ現在の画像を維持）</label><input id="editCardImage" type="file" accept="image/*"><div class="modal-actions"><button class="secondary" onclick="openCatalogEditor()">戻る</button><button onclick="saveEditedCatalogCard('${c.id}')">変更を保存</button></div></div></div>`}
function saveEditedCatalogCard(id){let series=document.getElementById('editCardSeries').value.trim(),number=document.getElementById('editCardNumber').value.trim(),name=document.getElementById('editCardName').value.trim();if(!series||!number||!name){alert('弾・カード番号・カード名を入力してね');return}let catalog=getCatalog(),idx=catalog.findIndex(c=>c.id===id);if(idx<0)return;let file=document.getElementById('editCardImage').files[0],save=image=>{catalog[idx]={...catalog[idx],series,number,name,image:image===null?catalog[idx].image:image};localStorage.setItem(CATKEY,JSON.stringify(catalog));alert('カード情報を更新したよ！');openCatalogEditor();renderCatalog()};if(file){let reader=new FileReader();reader.onload=()=>save(reader.result);reader.readAsDataURL(file)}else save(null)}
function showFeatureLog(){let logs=readJSON(LOGKEY,[{date:'2026-11-25',text:'元ファイルの入力画面を維持し、ログ検索・カードカタログの試作機能を追加。'}]);alert(logs.map(l=>l.date+'：'+l.text).join('\n'))}
document.getElementById('date').value=new Date().toISOString().slice(0,10);drawRows();renderRecords();renderOptions();renderQuery();renderCatalog();renderMatches();
</script>
</body></html>
